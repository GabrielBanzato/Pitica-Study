# =============================================================
# Pitica Study - Stack para Portainer (Repository / Git)
#
# Portainer (Stack > Environment variables):
#   TUNNEL_TOKEN   = token do Cloudflare Tunnel
#   GEMINI_API_KEY = chave da API do Google Gemini
#   JWT_SECRET     = segredo dos tokens de login (mín. 32 caracteres)
#   ALLOW_REGISTRATION = true só se quiser liberar o cadastro público (padrão: false)
#
# Criar/redefinir usuário (Portainer > container pitica_api > Console):
#   npx tsx src/scripts/create-user.ts <email> <senha> [nome]
#
# Cloudflare (Zero Trust > Tunnels > Public Hostname):
#   Service: HTTP  ->  web:80
# =============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: pitica_study_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pitica
      POSTGRES_PASSWORD: piticapassword
      POSTGRES_DB: pitica_study
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitica -d pitica_study"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pitica_net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    pull_policy: build
    container_name: pitica_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://pitica:piticapassword@postgres:5432/pitica_study?schema=public
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      JWT_SECRET: ${JWT_SECRET}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
    volumes:
      - uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pitica_net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    pull_policy: build
    container_name: pitica_web
    restart: unless-stopped
    expose:
      - "80"        # acessível na rede interna como web:80 (usado pelo tunnel)
    ports:
      - "8080:80"   # acesso direto na rede local (opcional)
    depends_on:
      - api
    networks:
      - pitica_net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: pitica_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - web
    networks:
      - pitica_net

volumes:
  pgdata:
  uploads:

networks:
  pitica_net:
    driver: bridge
